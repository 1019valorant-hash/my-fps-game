<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My FPS Game - Browser Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="hud">
    <div class="top"><span id="health">HP 100</span><span id="ammo">30 / 90</span></div>
    <div id="crosshair">+</div>
    <div id="message">CLICK TO PLAY</div>
    <div id="help">WASD 이동 · Shift 달리기 · 마우스 조준 · 좌클릭 발사 · R 재장전 · Esc 일시정지</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
